<!-- ShrinkIt offscreen document.

     user right-clicked. No UI, no user-visible content.
     Loaded by the background worker via chrome.offscreen.createDocument
     with reason BLOBS. Script is entrypoints/offscreen/main.ts. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShrinkIt offscreen</title>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
