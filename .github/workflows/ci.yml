# CI for the ShrinkIt Chrome extension (WXT + React + Vite + TS + Tailwind).
# No secrets needed. Runs on push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # build MUST come before check:css / check:responsive: both scripts
      # read .output/chrome-mv3/ and fail when it does not exist yet.
      # Previous order ran them before build, so CI failed every time
      # at check:css even though local runs (build first) were green.
      - run: npm run build
      - run: npm run check:css
      - run: npm run check:responsive
      - run: npm run zip
