# CI for the ShrinkIt Chrome extension (WXT + React + Vite + TS + Tailwind).
# No secrets needed. Runs on push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:css
      - run: npm run check:responsive
      - run: npm run build
      - run: npm run zip
